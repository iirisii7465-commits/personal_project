<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<title>Track27 안지윤</title>
<link href="notice_write.css" rel="stylesheet">
<script src="member/login_function.js" defer></script>
<!-- 기능가져와서쓸때 링크걸어줘야됨 -->
</head>
<body>

	<header id="header">

		<div class="logo">
			<h1>YamMusic</h1>
		</div>

		<nav class="menu">
			<ul>
				<li><a href="#">ホーム</a></li>
				<li><a href="#">特徴</a></li>
				<li><a href="#">料金プラン</a></li>
				<li><a href="#">人気チャート</a></li>
			</ul>
		</nav>

		<div class="right-menu">

			<div class="memberLogin">


				<button class="join">会員登録</button>
				&nbsp;&nbsp;
				<button class="login">ログイン</button>
			</div>

			<button class="darkmood_moon" type="button">
				<i class="fa-solid fa-moon"></i>
			</button>
			<button class="change_lenguage" type="button">
				<i class="fa-solid fa-globe"></i>
			</button>


		</div>

	</header>



	<section id="recommend">
		<h3>Music Recommendation Write</h3>
		<p>おすすめの音楽を共有してください。</p>
		<div class="recommend_container">



			<div class="content_container">

				<div class="search_container">

					<div class="search_box_1">

<span class="song_title">曲名：</span> 

							
						<div class="selectSong_box" style="width: 15%;">
							<select class="selectSong">
								<option value="ネオンの海">ネオンの海</option>
								<option value="0.5秒の空白">0.5秒の空白</option>
								<option value="無重力サマー">無重力サマー</option>
								<option value="レモンソーダの夜">レモンソーダの夜</option>
								<option value="あの日の君へ">あの日の君へ</option>
								
							</select>
						</div>
							
							
	<span class="artist_title">アーティスト：</span> 
							<div class="Artist_box" style="width: 15%;">
							<select class="Artist">
								<option value="ネオンの海">ネオンの海</option>
								<option value="0.5秒の空白">0.5秒の空白</option>
								<option value="無重力サマー">無重力サマー</option>
								<option value="レモンソーダの夜">レモンソーダの夜</option>
								<option value="あの日の君へ">あの日の君へ</option>
								
							</select>
						</div>
							
							
						<div class="text" style="width: 30%;">
							<input type="text" class="text_box">
						</div>
			
						<div class="search_btcontainer" style="width: 20%;">
							<input type="button" class="search_button" value="検索">
						</div>
						
							<span class="content_author">投稿者：</span>

						

					</div>


					<div class="content_boxing">
						<div class="content">




							<div class="content_info">
							
							<div class="content_writer">
								
								
								
								</div>
								
							</div>
								
						</div>

					</div>
<div class="btn_box" style="width: 100%;">

							<button class="write_button">投稿する</button>


						</div>


			</div>









		</div>
</div>
	</section>






	<!-- 기능 -->


	<footer id="footer">
		<div class="footer_bottom">
			<p>© 2026 YAmMusic Inc. All Rights Reserved.</p>
		</div>





	</footer>

</html>
